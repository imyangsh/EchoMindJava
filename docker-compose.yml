services:
  redis:
    image: redis:7-alpine
    container_name: echomind-java-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-echomind123}
    ports:
      # 只绑定本机回环：Redis 里存有全部用户会话与画像，
      # 不能对宿主机所在网络开放
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    environment:
      # healthcheck 通过环境变量传口令，避免明文出现在 docker inspect 与进程列表中
      - REDISCLI_AUTH=${REDIS_PASSWORD:-echomind123}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    # LangChain4j 显式使用 v2 API；保留现有 Chroma 版本和持久化卷。
    image: chromadb/chroma:1.0.0
    container_name: echomind-java-chromadb
    ports:
      - "8002:8000"
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      # chroma 1.x 固定从 /data 读写数据（PERSIST_DIRECTORY/IS_PERSISTENT 已废弃）
      - chromadb-data:/data
    healthcheck:
      # 镜像内没有 curl，用 bash /dev/tcp 发最小 HTTP 请求探测 v2 heartbeat
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\\n\\n' >&3; head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  echomind-java:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echomind-java-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=http://chromadb
      - CHROMA_PORT=8000
      - ECHOMIND_DATA_DIR=/app/data/java
      - KNOWLEDGE_STORE_PATH=/app/data/java/knowledge-store.json
      - MEMORY_STORE_PATH=/app/data/java/memory-store.json
      - LLM_FALLBACK_ENABLED=true
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-anthropic}
      # 总预算低于 nginx 的 60s；覆盖到 50s 以上时须同步调整代理等待时间。
      # 显式转发，确保 shell 与 .env 的配置均可覆盖容器默认值。
      - AGENT_REQUEST_TIMEOUT_MS=${AGENT_REQUEST_TIMEOUT_MS:-50000}
      - AGENT_BRANCH_TIMEOUT_MS=${AGENT_BRANCH_TIMEOUT_MS:-30000}
      - AGENT_VERIFICATION_TIMEOUT_MS=${AGENT_VERIFICATION_TIMEOUT_MS:-8000}
      - AI_CONNECT_TIMEOUT=${AI_CONNECT_TIMEOUT:-3s}
      - AI_READ_TIMEOUT=${AI_READ_TIMEOUT:-30s}
      # 独立 EmbeddingModel：阿里云百炼 text-embedding-v4（OpenAI 兼容接口）
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      - DASHSCOPE_EMBEDDINGS_PATH=${DASHSCOPE_EMBEDDINGS_PATH:-/compatible-mode/v1/embeddings}
      - DASHSCOPE_EMBEDDING_MODEL=${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
      - DASHSCOPE_EMBEDDING_DIMENSIONS=${DASHSCOPE_EMBEDDING_DIMENSIONS:-1024}
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-echomind_knowledge_dashscope_te4_1024_v1}
      - CHROMA_ENABLED=${CHROMA_ENABLED:-true}
      - CHROMA_TENANT=${CHROMA_TENANT:-default_tenant}
      - CHROMA_DATABASE=${CHROMA_DATABASE:-default_database}
      # 管理接口（/knowledge/**、/mcp/**、/eval/** 等）的 API Key；
      # 不设置时管理接口一律拒绝访问（fail-closed）
      - ECHOMIND_API_KEY=${ECHOMIND_API_KEY:-}
      # 业务用户身份与配额；JSON 映射也支持 shell 覆盖 .env。
      - ECHOMIND_USER_KEYS=${ECHOMIND_USER_KEYS:-}
      - ECHOMIND_USER_REQUESTS_PER_MINUTE=${ECHOMIND_USER_REQUESTS_PER_MINUTE:-60}
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: echomind-java-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      echomind-java:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: echomind-java-nginx
    ports:
      - "8081:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      echomind-java:
        condition: service_started

volumes:
  redis-data:
  chromadb-data:
  app-data:
  prometheus-data:
