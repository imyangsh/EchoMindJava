user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml;

    upstream echomind_java_backend {
        least_conn;
        server echomind-java:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        server_name localhost;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://echomind_java_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /health {
            # 健康检查同样限流，避免被无成本刷量
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://echomind_java_backend/health;
            # 必须显式覆盖：默认 $proxy_host 是 upstream 组名（含下划线），
            # Tomcat 会因 "The character [_] is never valid in a domain name" 返回 400
            proxy_set_header Host $host;
            access_log off;
        }

        # /metrics 不经 nginx 对外暴露。
        # 原先的 "allow 172.16.0.0/12" 在容器化部署下形同虚设：外部请求经
        # docker-proxy 转发后 $remote_addr 是 bridge 网关地址（如 172.18.0.1），
        # 恰好落在白名单里。Prometheus 在 compose 内网直接抓应用容器，
        # 不需要走 nginx；确需对外暴露时请配置 real_ip + 鉴权。
        location /metrics {
            deny all;
        }
    }
}
